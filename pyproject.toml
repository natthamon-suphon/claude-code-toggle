[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-toggle"
description = "Switch between your Claude Code accounts, move a session to another account, and see each account's usage."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "natthamon-suphon" }]
keywords = ["claude", "claude-code", "cli", "accounts", "statusline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dynamic = ["version"]
# No runtime dependencies: cct uses the Python standard library only.
dependencies = []

[project.optional-dependencies]
# ruff is pinned to one minor version so its formatter output stays stable in CI.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16,<0.17"]

[project.scripts]
cct = "cct.cli:main"

[project.urls]
Homepage = "https://github.com/natthamon-suphon/claude-code-toggle"
Issues = "https://github.com/natthamon-suphon/claude-code-toggle/issues"
Changelog = "https://github.com/natthamon-suphon/claude-code-toggle/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "cct.__version__" }

# The package `cct` lives directly in src/ (no src/cct/ folder).
# Add every new subpackage to `packages`.
[tool.setuptools]
package-dir = { "cct" = "src" }
packages = ["cct", "cct.commands", "cct.schema", "cct.services", "cct.utils", "cct.web"]

[tool.setuptools.package-data]
"cct.web" = ["static/*.html"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]  # cct itself comes from `pip install -e .`
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
markers = [
    "e2e: runs cct as a separate process with a fake `claude` binary",
]

[tool.coverage.run]
source = ["cct"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH110"]
ignore = [
    "SIM108", # a ternary is not always clearer
]

[tool.ruff.lint.isort]
known-first-party = ["cct"]
