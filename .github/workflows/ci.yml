name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check src tests scripts

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  fedora:
    # Fedora's own python3 and pipx, as a Fedora user gets them from dnf.
    name: Test (Fedora 44, system Python)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: dnf install -y python3 pipx git
      - uses: actions/checkout@v6
      - name: Versions
        run: |
          grep PRETTY_NAME /etc/os-release
          python3 --version
          pipx --version
      - name: Tests, as a normal user (not root)
        run: |
          useradd -m tester
          chown -R tester .
          sudo -u tester -H bash -c 'python3 -m venv ~/venv && ~/venv/bin/python -m pip install -e ".[dev]" && ~/venv/bin/python -m pytest'
      - name: Install with pipx, as the README says
        run: sudo -u tester -H bash -c 'pipx install . && ~/.local/bin/cct --version'

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - name: Wheel and sdist
        run: python -m build
      - name: Single-file zipapp
        run: |
          python scripts/build_zipapp.py
          python dist/cct.pyz --version
